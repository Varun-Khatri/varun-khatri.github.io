
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{padding:1rem 0;font-family:var(--font-sans);color:var(--color-text-primary);}
.top-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center;}
.flt{padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);transition:all .12s;}
.flt.on{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);}
.leg-dot{width:12px;height:12px;border-radius:2px;flex-shrink:0;}
.mod-block{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:1rem;overflow:hidden;}
.mod-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--color-background-secondary);cursor:pointer;user-select:none;}
.mod-id{font-size:13px;font-weight:500;font-family:var(--font-mono);min-width:32px;}
.mod-title{font-size:13px;font-weight:500;flex:1;}
.mod-meta{font-size:11px;color:var(--color-text-tertiary);}
.mod-chevron{font-size:14px;color:var(--color-text-tertiary);transition:transform .15s;}
.mod-chevron.open{transform:rotate(180deg);}
.mod-body{display:none;padding:12px 14px;}
.mod-body.open{display:block;}
.mod-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--color-border-tertiary);}
.plat-table{width:100%;border-collapse:collapse;font-size:12px;}
.plat-table th{text-align:left;font-weight:500;font-size:11px;color:var(--color-text-tertiary);padding:4px 8px 4px 0;border-bottom:0.5px solid var(--color-border-tertiary);}
.plat-table td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:0.5px solid var(--color-border-tertiary);}
.plat-table tr:last-child td{border-bottom:none;}
.plat-table td:first-child{font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary);white-space:nowrap;}
.col-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:5px;border:0.5px solid rgba(0,0,0,0.1);}
.fn-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;background:var(--color-background-secondary);color:var(--color-text-secondary);margin-left:4px;}
.vec{font-family:var(--font-mono);font-size:11px;color:var(--color-text-primary);}
.note{font-size:11px;color:var(--color-text-tertiary);font-style:italic;}
.section-sep{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary);margin:1.25rem 0 .5rem;}
</style>

<div class="wrap">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Echo Fold Unity module prefab reference — platform positions, scales, rotations and colours</h2>

<div class="top-bar">

  <button class="flt" onclick="filterMod('A',this)">A — straight</button>
  <button class="flt" onclick="filterMod('B',this)">B — gaps</button>

  <button class="flt" onclick="filterMod('E',this)">E — A+B</button>

</div>

function colorSwatch(hex){return `<span class="col-swatch" style="background:${hex}"></span><code style="font-size:11px;">${hex}</code>`;}

function renderMods(filter){
  const list=document.getElementById('mod-list');
  list.innerHTML='';
  const filtered=MODS.filter(m=>filter==='all'||m.cat===filter);
  if(!filtered.length){list.innerHTML='<p style="font-size:13px;color:var(--color-text-tertiary);padding:1rem 0;">No modules in this category yet.</p>';return;}
  filtered.forEach(m=>{
    const div=document.createElement('div');
    div.className='mod-block';
    div.dataset.cat=m.cat;
    const rows=m.platforms.map(p=>`
      <tr>
        <td>${p.n}</td>
        <td>${p.fn}<span class="fn-badge">${p.fn.split(' ')[0]}</span></td>
        <td class="vec">${p.pos}</td>
        <td class="vec">${p.scale}</td>
        <td class="vec">${p.rot}</td>
        <td>${colorSwatch(p.color)}</td>
        <td class="note">${p.note}</td>
      </tr>`).join('');
    div.innerHTML=`
      <div class="mod-hd" onclick="toggleMod(this)">
        <span class="mod-id">${m.id}</span>
        <span class="mod-title">${m.title}</span>
        <span class="mod-meta">Footprint: ${m.footprint} &nbsp;·&nbsp; ${m.platforms.length} platforms</span>
        <i class="ti ti-chevron-down mod-chevron" aria-hidden="true"></i>
      </div>
      <div class="mod-body">
        <p class="mod-desc">${m.desc}</p>
        <div style="overflow-x:auto;">
        <table class="plat-table">
          <thead><tr>
            <th>#</th><th style="min-width:140px;">Function</th>
            <th style="min-width:120px;">Position (x,y,z)</th>
            <th style="min-width:110px;">Scale (x,y,z)</th>
            <th style="min-width:80px;">Rotation (x,y,z)</th>
            <th style="min-width:120px;">Color</th>
            <th style="min-width:160px;">Notes</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      </div>`;
    list.appendChild(div);
  });
}

function toggleMod(hd){
  const body=hd.nextElementSibling;
  const chev=hd.querySelector('.mod-chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function filterMod(cat,btn){
  document.querySelectorAll('.flt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderMods(cat);
}

renderMods('all');
</script>
